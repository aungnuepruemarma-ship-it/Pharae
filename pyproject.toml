[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-runtime"
version = "0.1.0"
description = "Pharae — a model-agnostic intelligence runtime that coordinates capabilities, verifies outcomes, and learns from experience."
requires-python = ">=3.11"
# The kernel and schemas are standard-library only by design (ADR-0001).
# Capabilities and plugins declare their own dependencies.
dependencies = []

[project.optional-dependencies]
# The browser capability's one V1 backend (docs/volume-2-modules/browser.md).
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["nexus*"]
