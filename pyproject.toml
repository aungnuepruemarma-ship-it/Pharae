[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-runtime"
version = "0.1.0"
description = "Pharae — a model-agnostic intelligence runtime that coordinates capabilities, verifies outcomes, and learns from experience."
requires-python = ">=3.11"
# The kernel and schemas are standard-library only by design (ADR-0001).
# Capabilities and plugins declare their own dependencies.
dependencies = []

[tool.setuptools.packages.find]
include = ["nexus*"]
